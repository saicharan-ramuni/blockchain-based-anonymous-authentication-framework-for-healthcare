<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Key Generation — Healthcare BCCA</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body{background:#f0f4f8;} .card{border:none;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.1);}
.step-badge{background:#e8f0fe;color:#1a6fc4;border-radius:50%;width:28px;height:28px;
  display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;}</style>
</head>
<body>
<nav class="navbar navbar-dark" style="background:#0d4f8c">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/"><i class="fas fa-heartbeat me-2"></i>Healthcare BCCA</a>
    <a href="/" class="btn btn-outline-light btn-sm">Home</a>
  </div>
</nav>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card p-5">
        <h3 class="fw-bold mb-1"><i class="fas fa-key text-warning me-2"></i>Algorithm 4: Key Generation</h3>
        <p class="text-muted mb-4">Enter the partial key material received from the Hospital Admin (HA).</p>

        {% if error %}
        <div class="alert alert-danger"><i class="fas fa-exclamation-circle me-2"></i>{{ error }}</div>
        {% endif %}

        <div class="alert alert-info small mb-4">
          <span class="step-badge me-2">4.1</span> Verify psk_i · G == gpk_i + h₁_i · P_pub<br>
          <span class="step-badge me-2 mt-2">4.2</span> Precompute SID/KID sets (n=20 pairs)<br>
          <span class="step-badge me-2 mt-2">4.3</span> Precompute encryption sets Q/ek for EHR upload
        </div>

        <form method="POST">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label fw-bold">Pseudonym ID (ID_i)</label>
              <input type="text" class="form-control font-monospace" name="id_i" required
                     placeholder="Hex-encoded pseudonym from HA">
            </div>
            <div class="col-12">
              <label class="form-label fw-bold">Partial Public Key gpk_i (hex ECPoint)</label>
              <input type="text" class="form-control font-monospace" name="gpk_i" required
                     placeholder="04...">
            </div>
            <div class="col-12">
              <label class="form-label fw-bold">Partial Private Key psk_i (decimal)</label>
              <input type="text" class="form-control font-monospace" name="psk_i" required
                     placeholder="Large integer">
            </div>
            <div class="col-12">
              <label class="form-label fw-bold">E_i = d_i · G (hex ECPoint)</label>
              <input type="text" class="form-control font-monospace" name="e_i" required
                     placeholder="04...">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">A_i (decimal)</label>
              <input type="text" class="form-control font-monospace" name="a_i" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">B_i (decimal)</label>
              <input type="text" class="form-control font-monospace" name="b_i" required>
            </div>
            <div class="col-12">
              <label class="form-label fw-bold">h₁_i (decimal)</label>
              <input type="text" class="form-control font-monospace" name="h1_i" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">Role</label>
              <select class="form-select" name="role">
                <option value="PATIENT">Patient</option>
                <option value="DOCTOR">Doctor</option>
              </select>
            </div>
            <div class="col-md-6" id="yField" style="display:none">
              <label class="form-label fw-bold">Doctor Decrypt Key y (if DOCTOR)</label>
              <input type="text" class="form-control font-monospace" name="y"
                     placeholder="Decimal scalar y">
            </div>
          </div>

          <button type="submit" class="btn btn-warning w-100 py-2 fw-bold mt-4">
            <i class="fas fa-cogs me-2"></i>Generate Full Keys + Precomputed Sets
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.querySelector('select[name="role"]').addEventListener('change', function() {
  document.getElementById('yField').style.display = this.value === 'DOCTOR' ? 'block' : 'none';
});
</script>
</body></html>
