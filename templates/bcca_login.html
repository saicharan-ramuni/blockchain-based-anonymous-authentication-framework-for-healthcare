<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login — Healthcare BCCA</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body{background:#f0f4f8;}
.card{border:none;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.1);}
.role-card{cursor:pointer;border:2px solid #e5e7eb;border-radius:12px;padding:20px;
           text-align:center;transition:.2s;}
.role-card:hover{border-color:#0d4f8c;}
.role-card.selected-patient{border-color:#1d4ed8;background:#eff6ff;}
.role-card.selected-doctor{border-color:#065f46;background:#f0fdf4;}
input[type=radio]{display:none;}
</style>
</head>
<body>
<nav class="navbar navbar-dark" style="background:#0d4f8c">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/"><i class="fas fa-heartbeat me-2"></i>Healthcare BCCA</a>
    <a href="/register" class="btn btn-outline-light btn-sm">Register</a>
  </div>
</nav>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card p-5">
        <h3 class="fw-bold mb-1 text-center"><i class="fas fa-sign-in-alt text-primary me-2"></i>Login</h3>
        <p class="text-muted text-center mb-4">Select your role and enter credentials</p>

        {% if error %}
        <div class="alert alert-danger"><i class="fas fa-exclamation-circle me-2"></i>{{ error }}</div>
        {% endif %}

        <form method="POST" id="loginForm">
          <!-- Role Selection -->
          <div class="mb-4">
            <label class="form-label fw-bold">I am a</label>
            <div class="row g-3">
              <div class="col-6">
                <label class="role-card d-block" id="cardPatient" onclick="selectRole('PATIENT')">
                  <input type="radio" name="role" value="PATIENT" id="rolePatient" checked>
                  <i class="fas fa-user-injured fa-2x text-primary mb-2 d-block"></i>
                  <div class="fw-bold">Patient</div>
                </label>
              </div>
              <div class="col-6">
                <label class="role-card d-block" id="cardDoctor" onclick="selectRole('DOCTOR')">
                  <input type="radio" name="role" value="DOCTOR" id="roleDoctor">
                  <i class="fas fa-user-md fa-2x text-success mb-2 d-block"></i>
                  <div class="fw-bold">Doctor</div>
                </label>
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold" id="ridLabel">Aadhaar / Patient ID</label>
            <input type="text" class="form-control" name="rid" id="ridInput" required
                   placeholder="Enter your identity">
          </div>
          <div class="mb-4">
            <label class="form-label fw-bold">Password</label>
            <input type="password" class="form-control" name="password" required>
          </div>

          <button type="submit" class="btn w-100 py-2 fw-bold" id="loginBtn"
                  style="background:#1d4ed8;color:#fff;">
            <i class="fas fa-unlock-alt me-2"></i>Login as Patient
          </button>
        </form>
        <hr>
        <p class="text-center text-muted small">New user? <a href="/register">Register here</a></p>
      </div>
    </div>
  </div>
</div>
<script>
function selectRole(role) {
  const isDoctor = role === 'DOCTOR';
  document.getElementById('cardPatient').className =
    'role-card d-block' + (!isDoctor ? ' selected-patient' : '');
  document.getElementById('cardDoctor').className =
    'role-card d-block' + (isDoctor ? ' selected-doctor' : '');
  document.getElementById('ridLabel').textContent =
    isDoctor ? 'Medical License ID' : 'Aadhaar / Patient ID';
  document.getElementById('ridInput').placeholder =
    isDoctor ? 'Enter your Medical License ID' : 'Enter your Aadhaar / Patient ID';
  const btn = document.getElementById('loginBtn');
  btn.style.background = isDoctor ? '#065f46' : '#1d4ed8';
  btn.innerHTML = `<i class="fas fa-unlock-alt me-2"></i>Login as ${isDoctor ? 'Doctor' : 'Patient'}`;
}
// Set initial state
selectRole('PATIENT');
</script>

<!-- Launcher switch button -->
<a href="http://localhost:5000" title="Back to Mode Selector"
   style="position:fixed;bottom:24px;right:24px;z-index:9999;
          background:#0f2027;color:#fff;border-radius:50px;
          padding:10px 18px;font-size:.82rem;font-weight:600;
          text-decoration:none;box-shadow:0 4px 16px rgba(0,0,0,.4);
          display:flex;align-items:center;gap:8px;transition:.2s;"
   onmouseover="this.style.background='#065f46'"
   onmouseout="this.style.background='#0f2027'">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
  Switch Mode
</a>
</body>
</html>
