<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login — Healthcare BCCA</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body{background:#f0f4f8;} .card{border:none;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.1);}</style>
</head>
<body>
<nav class="navbar navbar-dark" style="background:#0d4f8c">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/"><i class="fas fa-heartbeat me-2"></i>Healthcare BCCA</a>
    <a href="/register" class="btn btn-outline-light btn-sm">Register</a>
  </div>
</nav>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-5">
        <h3 class="fw-bold mb-1 text-center"><i class="fas fa-sign-in-alt text-primary me-2"></i>Algorithm 5: Login</h3>
        <p class="text-muted text-center mb-4">Multi-factor authentication — no biometric hardware required</p>

        {% if error %}
        <div class="alert alert-danger"><i class="fas fa-exclamation-circle me-2"></i>{{ error }}</div>
        {% endif %}

        <div class="alert alert-info small mb-4">
          <i class="fas fa-info-circle me-2"></i>
          <strong>Multi-factor factors:</strong>
          Something you <em>know</em> (Password, DOB, SA) +
          Something you <em>have</em> (device with A_i, B_i).
        </div>

        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-bold">Pseudonym ID (ID_i)</label>
            <input type="text" class="form-control" name="pseudo_id" required
                   placeholder="Your pseudonym from key generation">
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Real Identity (RID_i)</label>
            <input type="text" class="form-control" name="rid" required
                   placeholder="Aadhaar/SSN or Medical License ID">
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Password</label>
            <input type="password" class="form-control" name="password" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Date of Birth</label>
            <input type="date" class="form-control" name="dob" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Security Answer</label>
            <input type="text" class="form-control" name="security_answer" required>
          </div>
          <div class="mb-4">
            <label class="form-label fw-bold">Other Details (Blood Group / Medical Reg. No.)</label>
            <input type="text" class="form-control" name="other_details" required>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
            <i class="fas fa-unlock-alt me-2"></i>Login
          </button>
        </form>
        <hr>
        <p class="text-center text-muted small">New user? <a href="/register">Register here</a></p>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
